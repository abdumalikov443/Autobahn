version: "3.3"

services:
  autobahn:
    container_name: autobahn
    restart: always
    image: node:20.10.0 
    ports:
      - 8001:3001
    volumes:
      - ./:/usr/src/autobahn
    working_dir: /usr/src/autobahn 

    networks:
      - autobahn-network

    # For Production
    command: bash -c "npm install && npm run build && cp -r src/views src/public dist/ && node dist/server.js"


networks:
  autobahn-network:
    driver: bridge

  

# autobahn-next: localhost: 8000 <=> container: 3000
# autobahn:      localhost: 8001 <=> container: 3001
